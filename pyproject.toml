[project]
name = "wagtail-notion-form"
version = "0.1.0"
description = "Sync a sites-conformes contact FormPage's submissions into a Notion database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Framework :: Django",
    "Framework :: Wagtail",
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "wagtail>=6.0",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/incubateur-ademe/wagtail-notion-form"
Repository = "https://github.com/incubateur-ademe/wagtail-notion-form"
Changelog = "https://github.com/incubateur-ademe/wagtail-notion-form/blob/main/CHANGELOG.md"
Issues = "https://github.com/incubateur-ademe/wagtail-notion-form/issues"

[dependency-groups]
dev = [
    "ruff>=0.15",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wagtail_notion_form"
