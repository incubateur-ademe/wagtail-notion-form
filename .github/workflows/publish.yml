# Publishes to PyPI when a GitHub release is published, with trusted publishing (no token).
# See https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false # prevent cache poisoning
      - name: Install gettext to compile translation files
        run: sudo apt-get install -y gettext
      - run: uv run django-admin compilemessages
        working-directory: src/wagtail_notion_form
      - run: uv build --verbose
      - run: >-
          uv run --isolated --no-project --with dist/*.whl python -c
          "import importlib.resources as r;
          f = r.files('wagtail_notion_form');
          assert all((f / p).is_file() for p in ('locale/fr/LC_MESSAGES/django.mo',))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: ./dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for trusted publishing
    environment: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          print-hash: true
